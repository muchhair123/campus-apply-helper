<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>某银行校园招聘 - 网申</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 20px auto; }
    .row { margin: 10px 0; }
    .form-item { margin: 10px 0; }
    .ant-form-item-label { color: #333; display:inline-block; width:120px; }
    table { border-collapse: collapse; }
    td { padding: 6px; border: 1px solid #eee; }
    input, select { padding: 5px; }
  </style>
</head>
<body>
  <h1>某某银行</h1>
  <h2>校园招聘网上申请</h2>

  <!-- label[for] 布局 -->
  <div class="row"><label for="xm">姓名</label> <input id="xm" type="text"></div>
  <div class="row"><label for="sjh">手机号码</label> <input id="sjh" type="text"></div>
  <div class="row"><label for="em">电子邮箱</label> <input id="em" type="email"></div>
  <div class="row"><label for="sfz">身份证号码</label> <input id="sfz" type="text"></div>

  <!-- placeholder-only -->
  <div class="row"><input id="p1" placeholder="请输入政治面貌"></div>

  <!-- select -->
  <div class="row">
    <label for="xl">最高学历</label>
    <select id="xl"><option value="">请选择</option><option>大专</option><option>本科</option><option>硕士</option><option>博士</option></select>
  </div>

  <!-- ant-design 风格 -->
  <div class="form-item"><div class="ant-form-item-label"><label>毕业院校</label></div><input id="xx" type="text"></div>
  <div class="form-item"><div class="ant-form-item-label"><label>所学专业</label></div><input id="zy" type="text"></div>

  <!-- table 布局（国企常见） -->
  <table>
    <tr><td>籍贯</td><td><input id="jg" type="text"></td></tr>
    <tr><td>政治面貌</td><td><input id="zzmm" type="text"></td></tr>
    <tr><td>现居住地</td><td><input id="xjd" type="text"></td></tr>
  </table>

  <!-- radio 性别 -->
  <div class="row">
    性别：
    <label for="g1"><input id="g1" type="radio" name="gender" value="男">男</label>
    <label for="g2"><input id="g2" type="radio" name="gender" value="女">女</label>
  </div>

  <!-- name-only 英文线索 -->
  <div class="row">GPA: <input name="gpa" type="text"></div>

  <!-- 信息库里没有的字段，应进入 needManual -->
  <div class="row"><label for="jtcy">家庭成员主要社会关系</label><input id="jtcy" type="text"></div>
  <div class="row"><label for="ecjy">应急联系人</label><input id="ecjy" type="text"></div>

  <!-- ===== Element UI 风格区块（模拟邮储银行结构：无 id/name，标签在 .el-form-item__label）===== -->
  <h2>家庭关系（Element UI 风格）</h2>
  <div class="el-form">
    <div class="el-form-item is-required">
      <div class="el-form-item__label">姓名-父亲</div>
      <div class="el-form-item__content"><div class="el-input"><input class="el-input__inner" placeholder="请填写"></div></div>
    </div>
    <div class="el-form-item is-required">
      <div class="el-form-item__label">工作单位-父亲</div>
      <div class="el-form-item__content"><div class="el-input"><input class="el-input__inner" placeholder="请填写"></div></div>
    </div>
    <div class="el-form-item is-required">
      <div class="el-form-item__label">政治面貌-母亲</div>
      <div class="el-form-item__content"><div class="el-input"><input class="el-input__inner" placeholder="请填写"></div></div>
    </div>
    <!-- Element UI 下拉：readonly input 包在 .el-select 里，应进 needManual(reason=select)，不自动填 -->
    <div class="el-form-item">
      <div class="el-form-item__label">学历</div>
      <div class="el-form-item__content"><div class="el-select"><div class="el-input"><input class="el-input__inner" readonly placeholder="请选择"></div></div></div>
    </div>
    <!-- 银行专属字段：schema 无对应，应被跳过/不自动填 -->
    <div class="el-form-item is-required">
      <div class="el-form-item__label">父亲是否为邮储银行体系内单位员工</div>
      <div class="el-form-item__content"><div class="el-input"><input class="el-input__inner" placeholder="请选择"></div></div>
    </div>
  </div>

  <script src="mock-chrome.js"></script>
  <script src="../lib/profile-schema.js"></script>
  <script src="../lib/field-matcher.js"></script>
  <script>
    // 预置一个 profile 到 mock storage，再跑匹配计划
    const PROFILE = {
      basic: { name: '张三', phone: '13800138000', email: 'zhangsan@example.com',
               idCard: '110101199001011234', gender: '男', politicalStatus: '共青团员',
               nativePlace: '北京', currentCity: '上海' },
      education: [{ school: '清华大学', major: '计算机科学与技术', degree: '硕士', gpa: '3.8' }],
      familyFlat: { fatherName: '张大山', fatherCompany: '北京某国企', motherPolitical: '群众' },
    };
    const labelOf = (el) => {
      const fi = el.closest('.el-form-item');
      const lab = fi && fi.querySelector('.el-form-item__label');
      return el.id || el.name || (lab ? lab.textContent.trim() : el.placeholder);
    };
    window.__runPlan = function () {
      const plan = AH_Matcher.buildFillPlan(document, PROFILE);
      return {
        toFill: plan.toFill.map(x => ({ el: labelOf(x.el), label: x.label, value: x.value, conf: +x.confidence.toFixed(2) })),
        needManual: plan.needManual.map(x => ({ el: labelOf(x.el), label: x.label, reason: x.reason, suggest: x.suggest||'' })),
      };
    };
  </script>
</body>
</html>
